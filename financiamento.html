<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Turbo Car Semi-novos | Financiamento</title>

 <link rel="icon" type="image/png" href="imagens/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background-color:#f5f5f5;
}

.navbar{
    background-color:#1b1f24;
}

.hero{
    background: linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");
    background-size:cover;
    background-position:center;
    color:white;
    padding:100px 20px;
    text-align:center;
}

.hero h1{
    font-size:3rem;
    font-weight:bold;
}

.simulador{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.btn-turbo{
    background:#dc3545;
    color:white;
    border:none;
}

.btn-turbo:hover{
    background:#bb2d3b;
}

.resultado{
    background:#1b1f24;
    color:white;
    padding:20px;
    border-radius:10px;
}

footer{
    background:#1b1f24;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            Turbo Car Semi-novos
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="#">Financiamento</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="hero">
    <h1>Simule seu Financiamento</h1>
    <p>Descubra a melhor condição para comprar seu próximo carro.</p>
</section>

<section class="container my-5">

    <div class="simulador">

        <h2 class="text-center mb-4">
            Simulador de Financiamento
        </h2>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Escolha o veículo</label>

                <select class="form-select" id="carro">
                    <option>Honda Civic Touring 2020 - R$ 89.900</option>
                    <option>Toyota Corolla XEI 2021 - R$ 98.900</option>
                    <option>HB20 Comfort 2022 - R$ 67.900</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Entrada (R$)</label>

                <input
                type="number"
                class="form-control"
                id="entrada"
                placeholder="20000">
            </div>

            <div class="col-md-3">
                <label class="form-label">Parcelas</label>

                <select class="form-select" id="parcelas">
                    <option value="24">24x</option>
                    <option value="36">36x</option>
                    <option value="48">48x</option>
                    <option value="60">60x</option>
                </select>
            </div>

            <div class="col-12 text-center">
                <button class="btn btn-turbo px-5 mt-3" onclick="simular()">
                    Simular Financiamento
                </button>
            </div>

        </div>

    </div>

    <div id="resultado" class="resultado mt-4 d-none">

        <h4>Resultado da Simulação</h4>

        <p id="valorCarro"></p>

        <p id="valorFinanciado"></p>

        <p id="valorParcela"></p>

    </div>

</section>

<footer>
    © 2026 Turbo Car Semi-novos - Todos os direitos reservados.
</footer>

<script>

function simular(){

    let preco = 89900;

    const carro =
    document.getElementById("carro").value;

    if(carro.includes("Corolla")){
        preco = 98900;
    }

    if(carro.includes("HB20")){
        preco = 67900;
    }

    const entrada =
    Number(document.getElementById("entrada").value);

    const parcelas =
    Number(document.getElementById("parcelas").value);

    const financiado =
    preco - entrada;

    const parcela =
    financiado / parcelas;

    document.getElementById("resultado").classList.remove("d-none");

    document.getElementById("valorCarro").innerHTML =
    "<strong>Valor do veículo:</strong> R$ " +
    preco.toLocaleString("pt-BR");

    document.getElementById("valorFinanciado").innerHTML =
    "<strong>Valor financiado:</strong> R$ " +
    financiado.toLocaleString("pt-BR");

    document.getElementById("valorParcela").innerHTML =
    "<strong>Parcelas:</strong> " +
    parcelas + "x de R$ " +
    parcela.toFixed(2);

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
